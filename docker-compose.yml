services:

  postgres:
    image: postgres:16

    container_name: postgres

    restart: always

    environment:
      POSTGRES_DB: datacenter_monitoring
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: msaly2310

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql


  cleaning:
    build: ./cleaning

    container_name: cleaning

    depends_on:
      - postgres

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: datacenter_monitoring
      DB_USER: postgres
      DB_PASSWORD: msaly2310

    ports:
      - "5000:5000"


  collector:
    build: ./collector

    container_name: collector

    depends_on:
      - cleaning


  dashboard:
    build: ./dashboard

    container_name: dashboard

    depends_on:
      - cleaning

    ports:
      - "5001:5001"


volumes:

  postgres_data:
