apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: monitoring
spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres

  template:
    metadata:
      labels:
        app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16

          ports:
            - containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: datacenter_monitoring

            - name: POSTGRES_USER
              value: postgres

            - name: POSTGRES_PASSWORD
              value: msaly2310

          volumeMounts:
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d

      volumes:
        - name: init-script
          configMap:
            name: postgres-init
