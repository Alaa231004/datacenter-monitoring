<!DOCTYPE html>

<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inscription - Data Center Monitoring</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/auth.css') }}">

</head>

<body>

<div class="auth-container">

    <div class="auth-card">

        <div class="logo">
            DC
        </div>

        <h1>
            Data Center
        </h1>

        <p class="subtitle">
            Monitoring Platform
        </p>


        <h2>
            Créer un compte
        </h2>

        <p class="description">
            Créez votre compte administrateur.
        </p>


        <form id="register-form">

            <label>
                Username
            </label>

            <input
                id="username"
                type="text"
                placeholder="Votre username"
                required
            >


            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                placeholder="exemple@email.com"
                required
            >


            <label>
                Mot de passe
            </label>

            <input
                id="password"
                type="password"
                placeholder="Minimum 8 caractères"
                required
            >


            <label>
                Confirmer le mot de passe
            </label>

            <input
                id="confirm-password"
                type="password"
                placeholder="Confirmez le mot de passe"
                required
            >


            <button type="submit">
                Créer mon compte
            </button>

        </form>


        <div id="message"></div>


        <p class="switch">

            Vous avez déjà un compte ?

            <a href="/login">
                Se connecter
            </a>

        </p>

    </div>

</div>


<script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>

</html>
