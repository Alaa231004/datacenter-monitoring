
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Gestion des utilisateurs - Data Center Monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .admin-container { max-width: 900px; margin: 40px auto; padding: 0 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; border-radius: 8px; overflow: hidden; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f1f5ff; font-size: 13px; text-transform: uppercase; color: #555; }
        .badge { padding: 4px 10px; border-radius: 12px; font-size: 12px; font-weight: bold; }
        .badge.admin { background: #ffe4e4; color: #c0392b; }
        .badge.employee { background: #e4f1ff; color: #2874a6; }
        .create-form { background: white; padding: 20px; border-radius: 8px; margin-top: 20px; display: flex; gap: 12px; align-items: flex-end; }
        .create-form div { display: flex; flex-direction: column; }
        .create-form input { padding: 8px; border: 1px solid #ddd; border-radius: 6px; }
        .create-form button { padding: 9px 16px; background: #2874a6; color: white; border: none; border-radius: 6px; cursor: pointer; }
        #message { margin-top: 12px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <h2>Gestion des utilisateurs</h2>

        <div class="create-form">
            <div>
                <label for="username">Nom d'utilisateur</label>
                <input type="text" id="username" required>
            </div>
            <div>
                <label for="email">Email professionnel</label>
                <input type="email" id="email" required>
            </div>
            <button id="create-btn">+ Créer un utilisateur</button>
        </div>
        <p id="message"></p>

        <table>
            <thead>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Rôle</th>
                    <th>Statut</th>
                    <th>Créé le</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                <tr>
                    <td>{{ user.username }}</td>
                    <td>{{ user.email }}</td>
                    <td>
                        <span class="badge {{ 'admin' if user.role == 'ADMIN' else 'employee' }}">
                            {{ user.role }}
                        </span>
                    </td>
                    <td>{{ 'Actif' if user.is_active else 'Inactif' }}</td>
                    <td>{{ user.created_at }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>

    <script>
        document.getElementById("create-btn").addEventListener("click", async () => {
            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const messageEl = document.getElementById("message");
            messageEl.textContent = "";

            if (!username || !email) {
                messageEl.textContent = "Veuillez remplir tous les champs.";
                messageEl.style.color = "red";
                return;
            }

            try {
                const res = await fetch("/api/admin/users", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ username, email })
                });
                const data = await res.json();

                messageEl.textContent = data.message;
                messageEl.style.color = data.success ? "green" : "red";

                if (data.success) {
                    setTimeout(() => window.location.reload(), 1200);
                }
            } catch (err) {
                messageEl.textContent = "Erreur de connexion au serveur.";
                messageEl.style.color = "red";
            }
        });
    </script>
</body>
</html>
