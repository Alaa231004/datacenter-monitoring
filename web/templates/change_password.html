<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Changer mon mot de passe - Data Center Monitoring</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <h2>Data Center Monitoring</h2>
            <p>Pour des raisons de sécurité, veuillez choisir un nouveau mot de passe avant de continuer.</p>

            <form id="change-password-form">
                <label for="new_password">Nouveau mot de passe</label>
                <input type="password" id="new_password" name="new_password" minlength="8" required>

                <label for="confirm_password">Confirmer le mot de passe</label>
                <input type="password" id="confirm_password" name="confirm_password" minlength="8" required>

                <button type="submit">Modifier mon mot de passe</button>
            </form>

            <p id="message" style="margin-top: 16px;"></p>
        </div>
    </div>

    <script>
        const form = document.getElementById("change-password-form");
        const messageEl = document.getElementById("message");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            messageEl.textContent = "";

            const new_password = document.getElementById("new_password").value;
            const confirm_password = document.getElementById("confirm_password").value;

            try {
                const res = await fetch("/api/auth/change-password", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ new_password, confirm_password })
                });
                const data = await res.json();

                if (data.success) {
                    window.location.href = data.redirect || "/";
                } else {
                    messageEl.textContent = data.message;
                    messageEl.style.color = "red";
                }
            } catch (err) {
                messageEl.textContent = "Erreur de connexion au serveur.";
                messageEl.style.color = "red";
            }
        });
    </script>
</body>
</html>
